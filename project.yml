name: TroopLedger
options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "27"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  TroopLedger-iOS:
    type: application
    platform: iOS
    sources:
      - path: TroopLedger
        excludes:
          - Resources
      - path: TroopLedger/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TroopLedger
        DEVELOPMENT_TEAM: YYNDN9V2A4
        MARKETING_VERSION: "1.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.bettnet.TroopLedger
        CODE_SIGN_ENTITLEMENTS: Configuration/TroopLedger.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/TroopLedger-iOS-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          # The starting-workbook snapshot holds real names and transactions; ship it only in Debug builds.
          EXCLUDED_SOURCE_FILE_NAMES: TroopFinanceImport.json
  TroopLedger-macOS:
    dependencies:
      - package: Sparkle
    type: application
    platform: macOS
    sources:
      - path: TroopLedger
        excludes:
          - Resources
      - path: TroopLedger/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TroopLedger
        DEVELOPMENT_TEAM: YYNDN9V2A4
        MARKETING_VERSION: "1.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.bettnet.TroopLedger
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        CODE_SIGN_ENTITLEMENTS: Configuration/TroopLedger-macOS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/TroopLedger-macOS-Info.plist
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: TroopFinanceImport.json
  TroopLedgerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TroopLedgerTests
    dependencies:
      - target: TroopLedger-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bettnet.TroopLedgerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TroopLedger.app/Contents/MacOS/TroopLedger"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TroopLedger-iOS:
    build:
      targets:
        TroopLedger-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  TroopLedger-macOS:
    build:
      targets:
        TroopLedger-macOS: all
        TroopLedgerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TroopLedgerTests
    archive:
      config: Release
